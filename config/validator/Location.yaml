App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
              fields: [city, country]
              message: 'This location already exists.'
              groups: [create]
    properties:
        city:
            - NotBlank:
                  message: 'Please enter a city name.'
                  groups: [create, edit]
            - Length:
                  min: 2
                  max: 255
                  groups: [create, edit]
            - Regex:
                  pattern: '/^\p{Lu}/u'
                  message: 'City name must start with a capital letter.'
                  groups: [create]
        country:
            - NotBlank:
                  message: 'Please choose a country.'
                  groups: [create, edit]
            - Country:
                  groups: [create, edit]
        latitude:
            - NotBlank:
                  message: 'Please enter latitude.'
                  groups: [create, edit]
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Latitude must be between {{ min }} and {{ max }}.'
                  groups: [create, edit]
        longitude:
            -   NotBlank:
                    message: 'Please enter longitude.'
                    groups: [ create, edit ]
            -   Range:
                    min: -180
                    max: 180
                    notInRangeMessage: 'Longitude must be between {{ min }} and {{ max }}.'
                    groups: [ create, edit ]
